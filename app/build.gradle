
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.dussehraphotoorganizer'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.dussehraphotoorganizer'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "DussehraPhotoOrganizer.apk"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // EXIF metadata reader for capture date detection
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    // WorkManager for background camera photo processing
    implementation 'androidx.work:work-runtime:2.9.0'

    // Image loading for thumbnails and gallery preview
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // JSON serialization for local history and custom schedule saving
    implementation 'com.google.code.gson:gson:2.10.1'
}
