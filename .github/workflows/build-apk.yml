name: Build Dussehra Photo Organizer APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: |
          chmod +x gradlew || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK Generated
        run: |
          ls -la app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/DussehraPhotoOrganizer.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DussehraPhotoOrganizer-APK
          path: app/build/outputs/apk/debug/DussehraPhotoOrganizer.apk
          if-no-files-found: error
          retention-days: 14
